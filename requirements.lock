# Versions EXACTES avec lesquelles Recharges-VE.exe est construit.
#
# requirements.txt utilise « >= » : c'est ce qu'il faut pour installer
# l'application. Ce fichier-ci sert a l'inverse : reconstruire un exe
# a l'identique dans six mois, meme si les bibliotheques ont evolue.
#
#   py -m pip install -r requirements.lock
#
# Genere depuis py, l'interpreteur qui lance les sources, les tests ET
# qui construit l'exe (voir build.bat).
# Python 3.14.5.
# Contient les 5 dependances declarees ET leurs propres dependances,
# mais PAS pandas : build.bat l'exclut de l'executable. PySide6 y est
# depuis la 2.0.0 (l'interface), customtkinter n'y est plus.

