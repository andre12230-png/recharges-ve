<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Icone de Recharges VE : medaillon vert -> bleu, voiture vue de face,
       eclair sur la calandre, cable et prise autour de la voiture.
       Source de icone_voiture.ico et .png : voir generer_icone.py. -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DBE7E"/>
      <stop offset="1" stop-color="#1E6FD0"/>
    </linearGradient>
    <linearGradient id="vitre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F8FA8"/>
      <stop offset="1" stop-color="#1E6FA8"/>
    </linearGradient>
  </defs>

  <!-- Medaillon -->
  <circle cx="128" cy="128" r="122" fill="url(#fond)"/>

  <!-- Cable : un arc de cercle (rayon 96) qui part d'en bas a gauche, passe
       par le haut et s'arrete en haut a droite, ou la prise le prolonge. -->
  <path d="M 60.1 195.9 A 96 96 0 1 1 201.5 66.3" fill="none" stroke="#FFFFFF"
        stroke-width="9" stroke-linecap="round"/>
  <!-- Prise, dans le prolongement du cable (tangente a 50 degres) -->
  <g transform="translate(201.5 66.3) rotate(50)">
    <rect x="2" y="-12" width="24" height="24" rx="6" fill="#FFFFFF"/>
    <rect x="25" y="-8" width="12" height="5" rx="2" fill="#FFFFFF"/>
    <rect x="25" y="3" width="12" height="5" rx="2" fill="#FFFFFF"/>
  </g>

  <!-- Voiture vue de face, agrandie de 10 % autour de son centre -->
  <g transform="translate(128 136) scale(1.1) translate(-128 -131)">
    <!-- toit et pare-brise -->
    <path d="M 92 84 Q 96 76 106 76 L 150 76 Q 160 76 164 84 L 180 118
             L 76 118 Z" fill="#FFFFFF"/>
    <path d="M 100 90 Q 102 86 108 86 L 148 86 Q 154 86 156 90 L 167 114
             L 89 114 Z" fill="url(#vitre)"/>
    <!-- caisse -->
    <rect x="58" y="114" width="140" height="56" rx="18" fill="#FFFFFF"/>
    <!-- retroviseurs -->
    <rect x="50" y="108" width="20" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="186" y="108" width="20" height="10" rx="5" fill="#FFFFFF"/>
    <!-- phares -->
    <ellipse cx="82" cy="138" rx="12" ry="9" fill="#1E6FA8"/>
    <ellipse cx="174" cy="138" rx="12" ry="9" fill="#1E6FA8"/>
    <!-- roues -->
    <rect x="66" y="164" width="26" height="22" rx="7" fill="#0E3A5C"/>
    <rect x="164" y="164" width="26" height="22" rx="7" fill="#0E3A5C"/>
    <!-- eclair sur la calandre -->
    <path d="M 134 124 L 114 150 L 127 150 L 121 168 L 143 140 L 130 140 Z"
          fill="#FFD23F" stroke="#0E3A5C" stroke-width="2.5"
          stroke-linejoin="round"/>
  </g>
</svg>
